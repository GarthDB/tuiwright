name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Required gate 1: fmt + clippy + build + test ─────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install freeze (ANSI → PNG)
        run: |
          FREEZE_VER=0.2.2
          curl -sSL "https://github.com/charmbracelet/freeze/releases/download/v${FREEZE_VER}/freeze_${FREEZE_VER}_amd64.deb" -o /tmp/freeze.deb
          sudo dpkg -i /tmp/freeze.deb

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --no-default-features -- -D warnings

      - name: build
        run: cargo build --no-default-features

      - name: test
        run: cargo test --no-default-features

  # ── Required gate 4: live feature builds and tests on Linux + macOS ────────
  build-live:
    name: Build (live feature) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.toml') }}

      - name: Install freeze (Linux)
        if: runner.os == 'Linux'
        run: |
          FREEZE_VER=0.2.2
          curl -sSL "https://github.com/charmbracelet/freeze/releases/download/v${FREEZE_VER}/freeze_${FREEZE_VER}_amd64.deb" -o /tmp/freeze.deb
          sudo dpkg -i /tmp/freeze.deb

      - name: Install freeze (macOS)
        if: runner.os == 'macOS'
        run: |
          FREEZE_VER=0.2.2
          ARCH=$(uname -m)
          curl -sSL "https://github.com/charmbracelet/freeze/releases/download/v${FREEZE_VER}/freeze_${FREEZE_VER}_Darwin_${ARCH}.tar.gz" -o /tmp/freeze.tar.gz
          tar -xzf /tmp/freeze.tar.gz -C /tmp
          sudo mv "/tmp/freeze_${FREEZE_VER}_Darwin_${ARCH}/freeze" /usr/local/bin/freeze

      - name: Build fixture binary
        run: cargo build -p tuiwright-fixture

      - name: test with live feature
        run: cargo test --features live

  # ── Required gate 2: minimum supported Rust version ──────────────────────
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.toml') }}

      - name: build on MSRV
        run: cargo build --no-default-features

  # ── Required gate 3: security audit ─────────────────────────────────────
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

