name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build release binaries for Linux and macOS ────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tuiwright-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tuiwright-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tuiwright-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/tuiwright tuiwright
          tar czf ${{ matrix.artifact }}.tar.gz tuiwright
          rm tuiwright

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ── Create GitHub release and attach binaries ─────────────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Extract tag version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          # Pull the section for this release from CHANGELOG.md
          awk "/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > release_notes.txt
          cat release_notes.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: tuiwright ${{ github.ref_name }}
          body_path: release_notes.txt
          files: dist/**/*.tar.gz

  # ── Publish to crates.io ─────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-publish-${{ hashFiles('**/Cargo.toml') }}

      - name: Publish tuiwright-core
        run: cargo publish -p tuiwright-core --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for tuiwright-core to be indexed
        run: sleep 30

      - name: Publish tuiwright-mcp
        run: cargo publish -p tuiwright-mcp --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
