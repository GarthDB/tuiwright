[workspace]
members = [
    "crates/tuiwright-core",
    "crates/tuiwright-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GarthDB/tuiwright"
homepage = "https://github.com/GarthDB/tuiwright"
authors = ["Garth Braithwaite <garthdb@adobe.com>"]
rust-version = "1.88"

[workspace.dependencies]
# MCP
rmcp = { version = "0.16", features = ["server", "transport-io"] }

# Terminal multiplexer SDK
rmux-sdk = "0.5"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config
toml = "0.8"

# Testing
insta = { version = "1", features = ["ron"] }
