[package]
name = "tuiwright-mcp"
description = "MCP server binary for tuiwright — Playwright-style TUI development for AI agents"
keywords = ["tui", "terminal", "mcp", "ai", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "tuiwright"
path = "src/main.rs"

[dependencies]
tuiwright-core = { path = "../tuiwright-core" }
rmcp = { workspace = true }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# rmux-sdk is optional: live path only; gates behind the "live" feature so
# CI can build without the rmux daemon installed.
[dependencies.rmux-sdk]
workspace = true
optional = true

[features]
default = ["live"]
live = ["dep:rmux-sdk"]
